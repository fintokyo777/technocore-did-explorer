<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technocore DID Explorer — Verify Proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg:#fafafa; --card:#ffffff; --border:#ececef; --text:#18181b;
    --muted:#71717a; --faint:#a1a1aa; --accent:#0a84ff; --accent-soft:#e8f1ff;
    --ok:#16a34a; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
    --radius:16px; --shadow:0 1px 2px rgba(24,24,27,.04),0 8px 30px rgba(24,24,27,.06);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){ :root{
    --bg:#0b0b0f; --card:#16161c; --border:#26262e; --text:#fafafa;
    --muted:#a1a1aa; --faint:#71717a; --accent:#409cff; --accent-soft:#0a2a4d;
    --ok:#4ade80; --ok-soft:#052e16; --bad:#f87171; --bad-soft:#450a0a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.5); } }
  *{box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);max-width:680px;margin:0 auto;padding:3.2rem 1.2rem 5rem;-webkit-font-smoothing:antialiased;line-height:1.5}
  .brand{display:flex;align-items:center;gap:.7rem;margin-bottom:2.4rem}
  .logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),#0a4dff);display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.1rem;box-shadow:var(--shadow)}
  .brand h1{font-size:1.35rem;font-weight:600;letter-spacing:-.02em;margin:0}
  .brand p{margin:0;color:var(--muted);font-size:.85rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 1.6rem;box-shadow:var(--shadow);margin-bottom:1.3rem}
  .card h2{font-size:1.02rem;font-weight:600;margin:0 0 1.1rem;letter-spacing:-.01em}
  .card .hint{color:var(--faint);font-size:.8rem;margin:-.7rem 0 1rem}
  label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin:.9rem 0 .4rem;letter-spacing:.01em}
  label:first-of-type{margin-top:0}
  textarea,input[type=text]{width:100%;padding:.75rem .9rem;font-size:.9rem;font-family:var(--sans);color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:11px;outline:none;transition:border-color .15s,box-shadow .15s;resize:vertical}
  input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  ::placeholder{color:var(--faint)}
  .actions{display:flex;gap:.6rem;align-items:center;margin-top:1.1rem}
  button{padding:.62rem 1.25rem;font-size:.9rem;font-weight:500;font-family:var(--sans);border:0;border-radius:11px;background:var(--accent);color:#fff;cursor:pointer;transition:filter .15s,transform .05s}
  button:hover{filter:brightness(1.07)} button:active{transform:scale(.98)}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;padding:.3rem .7rem;border-radius:999px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .result{margin-top:1.2rem}
  .verdict{display:flex;align-items:center;gap:.8rem;padding:1rem 1.1rem;border-radius:12px;margin-bottom:1rem}
  .verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}
  .verdict .mark{font-size:1.5rem;line-height:1} .verdict .vt{font-weight:600;font-size:1rem} .verdict .vs{font-size:.8rem;color:var(--muted)}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:.5rem .8rem;font-size:.86rem;margin-top:.4rem}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:.8rem;word-break:break-all}
  details{margin-top:1rem;border-top:1px solid var(--border);padding-top:.8rem}
  summary{cursor:pointer;font-size:.78rem;color:var(--muted)}
  pre{background:#0b0b0f;color:#d4d4d8;padding:1rem;border-radius:10px;overflow:auto;max-height:320px;font-family:var(--mono);font-size:12px;line-height:1.5;margin:.6rem 0 0;white-space:pre-wrap;word-break:break-word}
  footer{text-align:center;color:var(--faint);font-size:.76rem;margin-top:2.4rem}
  a{color:var(--accent);text-decoration:none}
  .err{color:var(--bad);font-size:.82rem;margin-top:.6rem}
</style>
</head>
<body>
<div class="brand">
  <div class="logo">◎</div>
  <div><h1>Technocore DID Explorer</h1><p>Verify a contribution proof — in your browser</p></div>
</div>

<div class="card">
  <h2>Verify a contribution proof</h2>
  <p class="hint">Paste a proof URL or the raw JSON. Verified entirely in your browser with Ed25519 — no server, no key, no upload.</p>
  <form id="vForm">
    <label>Proof URL or inline JSON</label>
    <textarea id="proof" rows="4" placeholder='https://gist.github.com/.../proof.json  —  or paste the proof JSON'></textarea>
    <div class="actions">
      <button type="submit" id="vBtn">Verify proof</button>
      <div class="spinner" id="vSpin"></div>
    </div>
  </form>
  <div class="result" id="vResult"></div>
  <div class="err" id="vErr"></div>
</div>

<footer>Technocore DID Explorer &middot; static &amp; client-side &middot; <a href="https://github.com/fintokyo777/technocore-did-explorer">GitHub</a></footer>

<script type="module">
// noble cryptographic primitives (Ed25519 + hashing) loaded from CDN.
import { ed25519 } from "https://unpkg.com/@noble/curves@1.4.0/ed25519.js";
import { sha256 } from "https://unpkg.com/@noble/hashes@1.4.0/sha256.js";
import { bytesToHex, hexToBytes } from "https://unpkg.com/@noble/curves@1.4.0/_micro.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- did:key parsing (mirrors the Python signer) ---
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58decode(str){
  let num = 0n; const base = 58n;
  for (const ch of str){ const d = B58.indexOf(ch); if(d<0) throw new Error("bad base58 char"); num = num*base + BigInt(d); }
  let out = []; let n = num;
  while(n>0n){ out.unshift(Number(n%256n)); n/=256n; }
  // leading zeros
  let z=0; for(const ch of str){ if(ch==='1') z++; else break; }
  return new Uint8Array([...Array(z).fill(0), ...out]);
}
function didToPublicKey(did){
  if(!did.startsWith("did:key:z6Mk")) throw new Error("DID must be a did:key:z6Mk… Ed25519 key");
  const mb = did.slice("did:key:".length); // "z" + base58
  const raw = b58decode(mb.slice(1)); // drop multibase "z" prefix
  if(raw.length!==34 || raw[0]!==0xed || raw[1]!==0x01) throw new Error("DID is not an Ed25519 public key");
  return raw.slice(2);
}
function b64urlDecode(s){ s += "==".slice((s.length+1)%4); return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c=>c.charCodeAt(0)); }

// --- canonical payload (must match the Python signer byte-for-byte) ---
function contributionPayload(artifactUrl, commit){
  if(!artifactUrl.startsWith("https://") || artifactUrl.includes("#")) throw new Error("artifact URL must be absolute HTTPS without fragment");
  if(artifactUrl.includes("@")){ const host = artifactUrl.split("://",2)[1].split("/",2)[0]; if(host.includes("@")) throw new Error("artifact URL must not contain credentials"); }
  if(!/^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$/.test(commit)) throw new Error("commit must be 40 or 64 hex chars");
  const record = { artifact_url: artifactUrl, commit: commit.toLowerCase(), schema: "technocore-contribution-v1" };
  const keys = Object.keys(record).sort();
  const parts = keys.map(k => JSON.stringify(k)+":"+JSON.stringify(record[k]));
  return new TextEncoder().encode("{"+parts.join(",")+"}");
}

async function verifyProof(p){
  if(p.schema !== "technocore-contribution-proof-v1") throw new Error("unsupported proof schema");
  for(const f of ["did","artifact_url","commit","signature"]) if(typeof p[f]!=="string") throw new Error("missing field: "+f);
  const pub = didToPublicKey(p.did);
  const payload = contributionPayload(p.artifact_url, p.commit);
  const sig = b64urlDecode(p.signature);
  const ok = ed25519.verify(sig, payload, pub);
  return ok;
}

function renderResult(p, ok){
  if(ok){
    $("vResult").innerHTML = `<div class="verdict ok"><div class="mark">✓</div><div><div class="vt">Valid signature</div><div class="vs">Signed by the DID below — verified in your browser</div></div></div>
      <dl class="kv"><dt>DID</dt><dd>${esc(p.did)}</dd><dt>Artifact</dt><dd>${esc(p.artifact_url)}</dd><dt>Commit</dt><dd>${esc(p.commit)}</dd></dl>`;
  } else {
    $("vResult").innerHTML = `<div class="verdict bad"><div class="mark">✕</div><div><div class="vt">Invalid proof</div><div class="vs">Signature does not match the DID + payload</div></div></div>`;
  }
}

async function loadProof(src){
  src = src.trim();
  if(src.startsWith("{")||src.startsWith("[")) return JSON.parse(src);
  if(src.startsWith("http://")||src.startsWith("https://")){
    const r = await fetch(src); if(!r.ok) throw new Error("could not fetch proof URL ("+r.status+")");
    return await r.json();
  }
  // treat as local file path (only works if served) — fallback to JSON parse
  return JSON.parse(src);
}

$("vForm").onsubmit = async (e)=>{
  e.preventDefault();
  $("vErr").textContent=""; $("vResult").innerHTML="";
  const src = $("proof").value.trim();
  if(!src){ $("vErr").textContent="Paste a proof URL or JSON."; return; }
  $("vSpin").style.display="block";
  try{
    const p = await loadProof(src);
    const ok = await verifyProof(p);
    renderResult(p, ok);
  }catch(err){
    $("vErr").textContent = "✗ " + err.message;
  }finally{
    $("vSpin").style.display="none";
  }
};
</script>
</body></html>
